[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-budget-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["boto3>=1.37,<2", "fastapi>=0.115,<1", "mangum>=0.19,<1", "uvicorn[standard]>=0.34,<1", "PyJWT[crypto]>=2.10,<3", "google-re2==1.1.20251105"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1", "moto[dynamodb,ssm,sqs]>=5.1,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
